<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Tàng Nghệ Thuật Cá Nhân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        header h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 10px;
        }
        header p {
            color: #888;
            font-style: italic;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .art-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .art-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .art-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .art-info {
            padding: 15px;
        }
        .art-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .art-desc {
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bảo Tàng Triển Lãm Ảnh</h1>
        <p>Bộ sưu tập những khoảnh khắc và tác phẩm nghệ thuật cá nhân</p>
    </header>

    <main class="gallery">
        <!-- Bức ảnh số 1 -->
        <div class="art-card">
            <img src="https://picsum.photos/600/400?random=1" alt="Tác phẩm 1">
            <div class="art-info">
                <div class="art-title">Tác phẩm #1</div>
                <div class="art-desc">Mô tả ngắn về bức ảnh hoặc cảm xúc của bạn.</div>
            </div>
        </div>

        <!-- Bức ảnh số 2 -->
        <div class="art-card">
            <img src="https://picsum.photos/600/400?random=2" alt="Tác phẩm 2">
            <div class="art-info">
                <div class="art-title">Tác phẩm #2</div>
                <div class="art-desc">Mô tả ngắn về bức ảnh hoặc cảm xúc của bạn.</div>
            </div>
        </div>

        <!-- Bức ảnh số 3 -->
        <div class="art-card">
            <img src="https://picsum.photos/600/400?random=3" alt="Tác phẩm 3">
            <div class="art-info">
                <div class="art-title">Tác phẩm #3</div>
                <div class="art-desc">Mô tả ngắn về bức ảnh hoặc cảm xúc của bạn.</div>
            </div>
        </div>
    </main>

</body>
</html>
