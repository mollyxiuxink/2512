<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Nhỏ Của Tôi 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fff0f5;
            background-image: radial-gradient(#ffb6c1 1px, transparent 1px);
            background-size: 20px 20px;
            color: #5c3d46;
            font-family: 'Comfortaa', cursive, sans-serif;
            padding: 40px 20px;
        }

        /* Container chính */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header / Banner */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            font-size: 2.4rem;
            color: #ff69b4;
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 10px;
        }
        header p {
            color: #b05c78;
            font-size: 1.05rem;
        }

        /* Khung Section chung */
        section {
            background: #ffffff;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 35px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 8px 18px rgba(255, 182, 193, 0.35);
        }

        .section-title {
            font-size: 1.5rem;
            color: #ff1493;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        /* 1. Phần Giới Thiệu */
        .intro-content {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #ffb6c1;
            object-fit: cover;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
        }
        .intro-text {
            flex: 1;
            min-width: 250px;
            line-height: 1.7;
            color: #6b4450;
        }

        /* 2. Phần Liên Hệ */
        .contact-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .contact-btn {
            display: inline-block;
            background: #ffe4e1;
            color: #ff1493;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            border: 2px solid #ffb6c1;
            transition: all 0.3s ease;
        }
        .contact-btn:hover {
            background: #ff69b4;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        /* 3. Gallery Ảnh (Khung Chữ Nhật Dọc) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
